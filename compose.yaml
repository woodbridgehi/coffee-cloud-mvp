services:
  coffee-cloud-mvp:
    build:
      context: .
    container_name: coffee-cloud-mvp
    network_mode: host
    env_file:
      - .env
    environment:
      API_WORKERS: "2"
      RUN_BACKGROUND_WORKERS: "false"
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - ./.secrets/alipay:/run/secrets/alipay:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  coffee-mqtt-gateway:
    build:
      context: .
    container_name: coffee-mqtt-gateway
    network_mode: host
    env_file:
      - .env
      - .secrets/coffee-cloud-gateway.mqtt.env
    environment:
      DEVICE_API_BASE_URL: http://127.0.0.1:8788
      MQTT_COMMAND_CLAIM_SECONDS: "1"
      MQTT_GATEWAY_WORKERS: "4"
      MQTT_GATEWAY_QUEUE_CAPACITY: "10000"
      MQTT_GATEWAY_ID: coffee-mqtt-gateway-v1
      MQTT_TELEMETRY_BATCH_SIZE: "100"
      MQTT_TELEMETRY_BATCH_WAIT_SECONDS: "0.1"
    command: ["python", "-m", "app.mqtt_gateway"]
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  coffee-domain-worker:
    build:
      context: .
    container_name: coffee-domain-worker
    network_mode: host
    env_file:
      - .env
    command: ["python", "-m", "app.domain_worker"]
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - ./.secrets/alipay:/run/secrets/alipay:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  coffee-telemetry-redis:
    image: redis:7-alpine
    container_name: coffee-telemetry-redis
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--protected-mode", "yes", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - telemetry-redis-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telemetry-redis-data:

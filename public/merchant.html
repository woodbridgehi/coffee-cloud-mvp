<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F6F0E5">
  <title>Coffee Cloud · 客户运营后台</title>
  <link rel="stylesheet" href="shared/coffee-ui.css?v=20260902-cc5">
  <link rel="stylesheet" href="merchant.css?v=20260902-cc5">
  <script src="shared/cc-icons.js?v=20260902-cc5"></script>
</head>
<body class="m-body" data-shell="merchant">
  <a class="cc-skip" href="#workspace">跳到主内容</a>

  <!-- 演示模式横幅（仅 ?demo=1 时显示） -->
  <div id="demo-banner" class="cc-banner cc-banner--demo hidden" role="status" data-od-id="demo-banner"></div>

  <!-- 测试数据环境横幅（LIVE/TEST 切换为 TEST 时显示） -->
  <div id="env-banner" class="cc-banner cc-banner--test hidden" role="status" data-od-id="env-banner">当前为 TEST 环境：调用真实 API 与测试数据，不产生真实资金。</div>

  <!-- 认证界面（登录 / 注册 / 找回 / 重置 / 验证 / 邀请，由 merchant.js 渲染） -->
  <section id="auth-view" class="hidden" aria-label="账号入口" data-od-id="merchant-auth-view"></section>

  <!-- 应用外壳（cc-shell：侧栏 + 主区） -->
  <div id="shell" class="cc-shell hidden">
    <aside class="cc-side" id="sidebar" aria-label="主导航侧栏" data-od-id="merchant-sidebar">
      <div class="cc-side-brand">
        <span class="cc-logo" aria-hidden="true" data-cc-icon="coffee" data-size="16"></span>
        <span class="cc-brandname">Coffee Cloud</span>
      </div>
      <nav id="side-nav" class="cc-side-nav" aria-label="主导航"></nav>
      <div class="cc-side-foot">
        <div id="who" class="m-who"></div>
        <button id="logout-btn" class="cc-btn cc-btn--ghost cc-btn--sm" type="button">退出登录</button>
      </div>
    </aside>

    <div class="cc-main">
      <header class="cc-top" data-od-id="merchant-topbar">
        <div class="cc-top-left">
          <span class="cc-crumb" aria-hidden="true">商户工作台</span>
        </div>
        <div class="cc-top-right" id="top-user"></div>
      </header>
      <div class="cc-content">
        <!-- 全局范围条（组织 / 门店 / 日期 / 数据环境），由 merchant.js 填充 -->
        <div id="top-controls" class="cc-scopebar hidden" role="group" aria-label="数据范围" data-od-id="context-scope"></div>
        <main id="workspace" class="m-workspace" tabindex="-1" data-od-id="merchant-workspace"></main>
      </div>
    </div>
  </div>

  <!-- 移动端底部导航（由 merchant.js 按权限填充；桌面端由 CSS 隐藏） -->
  <nav id="bottom-nav" class="cc-bottomnav hidden" aria-label="移动端快捷导航"></nav>

  <!-- 演示工具（仅 ?demo=1 时显示，浮动按钮 + 面板） -->
  <div id="demo-tools" class="hidden" aria-label="演示工具"></div>

  <div id="toast-root" class="cc-toasts" role="status" aria-live="polite"></div>
  <div id="drawer-root" class="hidden" aria-hidden="true"></div>
  <div id="modal-root" class="cc-overlay hidden" aria-hidden="true"></div>

  <script type="module" src="/assets/merchant.js?v=20260902-cc5"></script>
</body>
</html>
